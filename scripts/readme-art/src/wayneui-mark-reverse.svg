<!--
  WayneUI mark, reversed.

  For the green bar and other dark surfaces. The frame is white and the tab
  stays gold, because the tab is gold in every variant.

  A rounded frame holding a solid form, with a gold tab on the lower edge. It
  reads as a container or a system rather than as an object, which is what a
  component library is.

  Traced from the approved artwork rather than redrawn, so the curve tension and
  the proportions are the ones that were chosen. The gap is transparent, so the
  mark sits on any surface without a knockout plate.

  Not a shield and not a W. Unit marks come from MarComm's asset library rather
  than being invented, so this sits beside the university identity rather than
  imitating it.
-->
