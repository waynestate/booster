# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# BOOSTER's pipeline, built from the PREFLIGHT components on this GitLab.
# Pinned to PREFLIGHT 0.1.2. Never use ~latest.
# BOOSTER requires PHP ^8.3, so the test matrix starts at 8.3.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.2
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.2
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.1.2
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --policy=vendor/waynestate/creed/policy/policy.json --format=codequality
      allow_failure: true

composer-ci:
  image: composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# Hop data freshness: only in scheduled pipelines. The hop data robot
# recomputes data/versions.json from the live feeds and, when it changed,
# pushes the refresh branch with merge request options so a merge request
# opens on BOOSTER itself; when nothing changed, it does nothing. A missing
# BOOSTER_BOT_TOKEN fails the job before it touches anything.
refresh-hop-data:
  image: composer:2.10.3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - php bin/hop-data-bot.php

# PHAR release: on a version tag, build the single-file phar and publish it as
# a GitLab release asset. One build recipe for both CI systems:
# scripts/build-phar.sh in no-Docker mode, because the runners may have no
# Docker daemon (the composer image ships php and composer).
phar:
  image: composer:2.10.3
  variables:
    BOOSTER_PHAR_NO_DOCKER: '1'
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/build-phar.sh
  artifacts:
    paths:
      - build/booster.phar
    expire_in: never

release:
  image:
    name: registry.gitlab.com/gitlab-org/release-cli:latest
    entrypoint: ['']
  needs:
    - phar
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Publishing the GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Booster $CI_COMMIT_TAG'
    description: 'Booster $CI_COMMIT_TAG as a single-file PHAR.'
    assets:
      links:
        - name: 'booster.phar'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/build/booster.phar?job=phar'
