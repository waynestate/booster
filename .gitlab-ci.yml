# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# Booster's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.8.0. Never use ~latest.
# Booster requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.8.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  # No image input: the 0.8.0 default is Composer 2.11.1, pinned by its multi-arch list digest.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.8.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy, and a failure blocks.
  # Since 0.5.0 the job also keeps PROCTOR's JSON report as proctor.json in its artifact, for ROLLCALL.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.8.0
    inputs:
      image: "php:8.5-cli-trixie@sha256:9236fd373d3bcda0659cf94838a744bd79791419292958963f8c6b34a0071554"
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.8.0
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

# WayneUI strict copies: PROCTOR runs on the project root so it sees site/assets/wayne-ui/.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    # Booster's Rector config must load before any hop rewrites code; an empty app dir satisfies its BOOSTER_APP_PATH check.
    - d=$(mktemp -d) && BOOSTER_APP_PATH="$d" php vendor/bin/rector validate-config --no-ansi --config=config/rector.php
    - composer ci

# Hop data freshness: only in scheduled pipelines. The hop data robot
# recomputes data/versions.json from the live feeds and, when it changed,
# pushes the refresh branch with merge request options so a merge request
# opens on Booster itself; when nothing changed, it does nothing. A missing
# BOOSTER_BOT_TOKEN fails the job before it touches anything.
refresh-hop-data:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - php bin/hop-data-bot.php

# PHAR release: on a version tag, build the single-file phar and publish it as
# a GitLab release asset. One build recipe for both CI systems:
# scripts/build-phar.sh in no-Docker mode, because the runners may have no
# Docker daemon (the composer image ships php and composer).
phar:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  variables:
    BOOSTER_PHAR_NO_DOCKER: '1'
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/build-phar.sh
  artifacts:
    paths:
      - build/booster.phar
    expire_in: never

# release-cli is deprecated by GitLab and has no build for non-amd64 runners,
# so this calls the Releases API with curl from a multi-arch image pinned by
# its manifest list digest (the runner is not amd64).
release:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    entrypoint: ['']
  needs:
    - phar
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      set -eu
      echo "Publishing the GitLab release for $CI_COMMIT_TAG"
      asset="$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/build/booster.phar?job=phar"
      body=$(printf '{"tag_name":"%s","name":"Booster %s","description":"Booster %s as a single-file PHAR.","assets":{"links":[{"name":"booster.phar","url":"%s","link_type":"package"}]}}' "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$asset")
      curl --silent --show-error --fail-with-body \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data "$body" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
