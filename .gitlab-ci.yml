# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# BOOSTER's pipeline, built from the PREFLIGHT components on this GitLab.
# Pinned to PREFLIGHT 0.1.0. Never use ~latest.
# The proctor component is not included yet: PROCTOR needs --policy until it
# reads CREED's bundled policy.
# BOOSTER requires PHP ^8.3, so the test matrix starts at 8.3.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.0

composer-ci:
  image: composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci
