# The local stand-in for Citadel's HA-Proxy (S36). Citadel's proxy is HA-Proxy 1.5, which is unmaintained (S77) and
# uses `reqadd`; that directive was removed in HA-Proxy 2.1, so this file says the same thing in current syntax:
#   option forwardfor                       Citadel: `option forwardfor`, adds X-Forwarded-For with the client address
#   http-request add-header X-Forwarded-Proto http
#                                           Citadel: `reqadd X-Forwarded-Proto:\ http`. It ADDS the header and strips
#                                           nothing, as Citadel's does, so an app that trusts the wrong hop is
#                                           caught here and not in production.
# TLS ends at Citadel's proxy. Locally everything is plain HTTP, so the app sees http unless you test with
# `curl -H 'X-Forwarded-Proto: https'` (see the README).
global
    maxconn 256
    log stdout format raw local0

# The engine's own DNS finds the app container by name: Docker's answers on its embedded loopback DNS, Podman's
# (aardvark-dns) on the network's gateway, and each engine writes its own into the container's /etc/resolv.conf. So
# read that file rather than name one address: a fixed Docker address times out on Podman, and a minute after start
# HAProxy takes the app out of service ("DNS timeout status") and answers 503. Ask the engine, not the neighbors.
resolvers engine
    parse-resolv-conf
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http-in
    bind *:8080
    option forwardfor
    http-request add-header X-Forwarded-Proto http
    default_backend app

backend app
    server app app:80 resolvers engine init-addr libc,none
