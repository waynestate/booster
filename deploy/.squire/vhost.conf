ServerName ${CITADEL_SERVER_NAME}
<VirtualHost *:80>
        ServerAdmin webmaster@localhost
        DocumentRoot ${CITADEL_PUBLIC_DIR}
		<Directory ${CITADEL_PUBLIC_DIR}>
		    Options FollowSymLinks
		    AllowOverride All
		    Require all granted
		</Directory>

        LogLevel info

        ErrorLog "|/usr/bin/rotatelogs -n 2 ${APACHE_LOG_DIR}/error.log 5M"
        CustomLog "|/usr/bin/rotatelogs -n 2 ${APACHE_LOG_DIR}/access.log 5M" combined
</VirtualHost>
