# apache-hardening.conf: what the base image tells strangers about itself.
#
# The fallback base installs this as conf-available/zz-squire-hardening.conf and enables it. The zz- prefix makes it
# load after Debian's security.conf, which ships ServerTokens OS and ServerSignature On, so these values win.
# It belongs to the base image, not to the app image: on the real Citadel image the base decides, and this file is
# the evidence for asking it to say the same.
#
#   ServerTokens Prod     the Server header says "Apache", not the version and the distribution
#   ServerSignature Off   error pages Apache writes itself carry no version footer
#   TraceEnable Off       TRACE answers 405, so a script cannot read cookies back off an echo (cross-site tracing)
#
# A good squire polishes the armour and keeps the maker's mark on the inside.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
