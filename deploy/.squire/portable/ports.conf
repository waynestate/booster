# ports.conf for the portable image: replaces Debian's (Listen 80, and 443 with mod_ssl).
#
# A user that is not root cannot bind below 1024, and the platform's router or proxy terminates TLS, so the image
# listens on one plain HTTP port. squire-entrypoint sets SQUIRE_PORT before Apache starts: SQUIRE_PORT, else PORT,
# else 8080.
Listen ${SQUIRE_PORT}
