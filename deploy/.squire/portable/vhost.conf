# vhost.conf for the portable image: Citadel's site (.squire/vhost.conf) on ${SQUIRE_PORT}, logging to the
# container's stdout and stderr instead of rotated files, so the platform collects the logs and nothing piles up in
# the container (WELD W14). The document root is the same CITADEL_PUBLIC_DIR.
ServerName ${CITADEL_SERVER_NAME}
ErrorLog /proc/self/fd/2

<VirtualHost *:${SQUIRE_PORT}>
        ServerAdmin webmaster@localhost
        DocumentRoot ${CITADEL_PUBLIC_DIR}
        <Directory ${CITADEL_PUBLIC_DIR}>
            Options FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        LogLevel info

        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
</VirtualHost>
