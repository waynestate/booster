; php.ini for local parity: the safe defaults HELMET also enforces at runtime.
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
unserialize_callback_func =
serialize_precision = -1
; The web gets a disable_functions list from php-web.ini; the CLI keeps every function, for Composer
; scripts and artisan. disable_classes is not set: PHP 8.5 removed it, and it never stopped a determined caller.
disable_functions =
zend.enable_gc = On
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0
expose_php = Off
max_execution_time = 30
max_input_time = 60
memory_limit = 128M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
ignore_repeated_errors = Off
ignore_repeated_source = Off
report_memleaks = On
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On
post_max_size = 8M
auto_prepend_file =
auto_append_file =
default_mimetype = "text/html"
default_charset = "UTF-8"
doc_root =
user_dir =
enable_dl = Off
file_uploads = On
upload_max_filesize = 2M
max_file_uploads = 20
allow_url_fopen = On
allow_url_include = Off
default_socket_timeout = 60
[CLI Server]
cli_server.color = On
[Date]
[filter]
[iconv]
[imap]
[intl]
[sqlite3]
[Pcre]
[Pdo]
[Pdo_mysql]
pdo_mysql.default_socket=
[Phar]
[mail function]
SMTP = localhost
smtp_port = 25
sendmail_path = /usr/sbin/sendmail -t -i
mail.add_x_header = On
[ODBC]
odbc.allow_persistent = On
odbc.check_persistent = On
odbc.max_persistent = -1
odbc.max_links = -1
odbc.defaultlrl = 4096
odbc.defaultbinmode = 1
[MySQLi]
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.default_socket =
mysqli.default_host =
mysqli.default_user =
mysqli.default_pw =
mysqli.reconnect = Off
[mysqlnd]
mysqlnd.collect_statistics = On
mysqlnd.collect_memory_statistics = Off
[OCI8]
[PostgreSQL]
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_persistent = -1
pgsql.max_links = -1
pgsql.ignore_notice = 0
pgsql.log_notice = 0
[bcmath]
bcmath.scale = 0
[browscap]
[Session]
session.save_handler = files
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.name = PHPSESSID
session.auto_start = 0
session.cookie_lifetime = 0
session.cookie_path = /
session.cookie_domain =
session.cookie_httponly = 1
session.cookie_secure = 1
; Lax: the cookie rides a top-level GET from another site (a CAS ticket redirect, a link) but never a cross-site
; POST, image or frame, which blunts CSRF. A SAML ACS gets a cross-site POST; SESAME parks it and finishes on a GET.
; Secure stays on: browsers reach a deployed app over https (TLS ends at the proxy in front of the container).
session.cookie_samesite = Lax
session.serialize_handler = php
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440
session.referer_check =
session.cache_limiter = nocache
session.cache_expire = 180
session.use_trans_sid = 0
session.trans_sid_tags = "a=href,area=href,frame=src,form="
[Assertion]
zend.assertions = -1
[COM]
[mbstring]
[gd]
[exif]
[Tidy]
tidy.clean_output = Off
[soap]
soap.wsdl_cache_enabled=1
soap.wsdl_cache_dir="/tmp"
soap.wsdl_cache_ttl=86400
soap.wsdl_cache_limit = 5
[sysvshm]
[ldap]
ldap.max_links = -1
[dba]
[opcache]
; Production opcache. A value written ${NAME:-default} reads the container's environment when NAME is set
; (PHP 8.3 and later), so one image serves production and a developer's bind mount.
opcache.enable = 1
opcache.enable_cli = 0
; How code arrives decides this. Pulled into a running container (a Citadel Quick Update, a bind mount, any target
; Squire cannot tell): 1, so opcache looks at a file again at most every revalidate_freq seconds and a release is
; served within 2 seconds, with no restart. Baked into an image that never changes (OpenShift, Coolify, raw Docker
; with the code copied in): build with SQUIRE_OPCACHE_VALIDATE=0 and opcache never checks a file again.
; SQUIRE_OPCACHE_VALIDATE (0 or 1) is the one switch, as a build argument of .squire/Dockerfile or at run time.
opcache.validate_timestamps = ${SQUIRE_OPCACHE_VALIDATE:-1}
opcache.revalidate_freq = 2
; Megabytes of shared memory, and the number of scripts it can hold: a Laravel app with its vendor/ is 10000 to 15000
; files, so 20000 leaves room before the cache fills and starts refusing new scripts.
opcache.memory_consumption = ${SQUIRE_OPCACHE_MEMORY:-128}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = ${SQUIRE_OPCACHE_MAX_FILES:-20000}
opcache.max_wasted_percentage = 10
; Doc comments stay: annotation readers and some packages read them at run time.
opcache.save_comments = 1
[curl]
[openssl]
[ffi]
