; php-web.ini: the settings only the web server gets. The app image appends this file to php.ini as
; php-apache2handler.ini, the file mod_php reads instead of php.ini, so the CLI (Composer and its scripts, artisan,
; the health check, the release script) keeps every function and the web loses the ones a request should never need.
; A squire carries the sword for the knight; he does not hand it to every visitor.
[PHP]
; Shell out and process replacement, and pages that print the server's own source or setup. proc_open and popen stay:
; Symfony Mailer's sendmail transport, Laravel's Process and PHPMailer use them on the web.
; SQUIRE_PHP_DISABLE_FUNCTIONS replaces the list, and `none` (a name no function has) disables nothing. Leave it unset
; for this list: PHP falls back only when the variable is unset, so an empty value disables nothing too.
; disable_classes is not set: PHP 8.5 removed it.
disable_functions = ${SQUIRE_PHP_DISABLE_FUNCTIONS:-exec,passthru,shell_exec,system,pcntl_exec,phpinfo,show_source,highlight_file}
