name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a Preflight release tag's commit, never a branch or ~latest. Bump with each Preflight release.
    uses: waynestate/preflight/.github/workflows/php-package.yml@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
