name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a Preflight release tag's commit, never a branch or ~latest. Bump with each Preflight release.
    uses: waynestate/preflight/.github/workflows/php-package.yml@fb73b538f3980292119b5b306ff64383d760a214 # 0.9.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
