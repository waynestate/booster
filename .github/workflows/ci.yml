name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a Preflight release tag's commit, never a branch or ~latest. Bump with each Preflight release.
    uses: waynestate/preflight/.github/workflows/php-package.yml@60314791565a264e97cb210813ef4f3e76512402 # 0.5.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
