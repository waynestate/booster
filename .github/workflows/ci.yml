name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pinned to the PREFLIGHT 0.1.2 release tag
    uses: waynestate/preflight/.github/workflows/php-package.yml@0.1.2
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
